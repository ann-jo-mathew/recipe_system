{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - CookShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .reset-box {
            max-width: 450px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            background: #fff;
        }
    </style>
</head>
<body>

<section class="vh-100 d-flex align-items-center justify-content-center" style="background-color: #f8f9fa;">
    <div class="container">
        <div class="row d-flex justify-content-center">
            <div class="col-md-6">
                <div class="reset-box text-center">
                    <h2>Reset Your Password</h2>
                    <p class="text-muted">Enter your username/email and set a new password.</p>
                    
                    <form method="POST">
                        {% csrf_token %}

                        <!-- Username or Email -->
                        <div class="mb-3">
                            <input type="text" name="username_email" class="form-control" placeholder="Username or Email" required>
                        </div>

                        <!-- New Password -->
                        <div class="mb-3">
                            <input type="password" name="new_password" class="form-control" placeholder="New Password" required>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm New Password" required>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100">Reset Password</button>
                    </form>

                    <!-- Display Messages -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} mt-3">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <a href="{% url 'loginuser' %}" class="d-block mt-3">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
