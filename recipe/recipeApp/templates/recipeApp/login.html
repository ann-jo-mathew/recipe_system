<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CookShare</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .divider:after,
        .divider:before {
            content: "";
            flex: 1;
            height: 1px;
            background: #eee;
        }
        .h-custom {
            height: calc(100% - 73px);
        }
        @media (max-width: 450px) {
            .h-custom {
                height: 100%;
            }
        }
        /* Box Styling */
        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        /* Password Field with Eye Icon */
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 40px; /* Space for eye icon */
        }
        .password-wrapper .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
        }
    </style>

    <script>
        function togglePassword() {
            var passwordField = document.getElementById("passwordField");
            var toggleIcon = document.querySelector(".toggle-password");
            if (passwordField.type === "password") {
                passwordField.type = "text";
                toggleIcon.classList.remove("fa-eye");
                toggleIcon.classList.add("fa-eye-slash");
            } else {
                passwordField.type = "password";
                toggleIcon.classList.remove("fa-eye-slash");
                toggleIcon.classList.add("fa-eye");
            }
        }
    </script>
</head>
<body>

<section class="vh-100">
    <div class="container-fluid h-custom">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-md-9 col-lg-6 col-xl-5">
                <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
                     class="img-fluid" alt="Sample image">
            </div>
            <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
                <div class="login-box">  <!-- Box added here -->
                    <div class="text-center">
                        <h2 class="mb-4">Login</h2>
                    </div>
                    <form method="POST">
                        {% csrf_token %}

                        <!-- Username/Email input -->
                        <div class="form-outline mb-4">
                            <label class="form-label" for="loginField">Username or Email</label>
                            <input type="text" id="loginField" name="username" class="form-control form-control-lg"
                                   placeholder="Enter your email or username" required />
                        </div>

                        <!-- Password input with Show/Hide option -->
                        <div class="form-outline mb-3 password-wrapper">
                            <label class="form-label" for="passwordField">Password</label>
                            <input type="password" id="passwordField" name="password" class="form-control form-control-lg"
                                   placeholder="Enter password" required />
                            <i class="fa-solid fa-eye toggle-password" onclick="togglePassword()"></i>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{% url 'password' %}" class="text-body">Forgot password?</a>
                        </div>

                        <div class="text-center text-lg-start mt-4 pt-2">
                            <button type="submit" class="btn btn-primary btn-lg w-100">Login</button>
                            <p class="small fw-bold mt-2 pt-1 mb-0">Don't have an account? 
                                <a href="{% url 'signup' %}" class="link-danger">Sign up</a>
                            </p>
                        </div>
                    </form>
                </div>  <!-- Box ends here -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="d-flex flex-column flex-md-row text-center text-md-start justify-content-between py-4 px-4 px-xl-5 bg-primary">
        <div class="text-white mb-3 mb-md-0">
            Copyright © 2025. All rights reserved.
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
