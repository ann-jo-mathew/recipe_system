<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CookShare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        .divider:after,
        .divider:before {
            content: "";
            flex: 1;
            height: 0.5px;
            background: #eee;
        }
        .h-custom {
            height: calc(100% - 73px);
        }
        @media (max-width: 450px) {
            .h-custom {
                height: 100%;
            }
        }
        .signup-box {
    max-width: 450px;  /* Adjust box width */
    min-height: 150px; /* Adjust minimum height */
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    background: #fff;
    display: flex;
    flex-direction: column;
}
    </style>
</head>
<body>

<section class="vh-100">
    <div class="container-fluid h-custom">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-md-9 col-lg-6 col-xl-5">
                <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp"
                     class="img-fluid" alt="Sample image">
            </div>
            <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
                <div class="signup-box">
                    <div class="text-center">
                        <h2 class="mb-4">Sign Up</h2>
                    </div>
                    <form method="POST" action="{% url 'loginuser' %}">
                        {% csrf_token %}

                        <!-- Username input -->
                        <div class="form-outline mb-4">
                            <label class="form-label" for="usernameField">Username</label>
                            <input type="text" id="usernameField" name="username" class="form-control form-control-lg"
                                   placeholder="Enter your username" required />
                        </div>

                        <!-- Email input -->
                        <div class="form-outline mb-4">
                            <label class="form-label" for="emailField">Email</label>
                            <input type="email" id="emailField" name="email" class="form-control form-control-lg"
                                   placeholder="Enter your email" required />
                        </div>

                        <!-- Password input -->
                        <div class="form-outline mb-3">
                            <label class="form-label" for="passwordField1">Password</label>
                            <input type="password" id="passwordField1" name="password1" class="form-control form-control-lg"
                                   placeholder="Enter password" required />
                        </div>

                        <!-- Confirm Password input -->
                        <div class="form-outline mb-3">
                            <label class="form-label" for="passwordField2">Confirm Password</label>
                            <input type="password" id="passwordField2" name="password2" class="form-control form-control-lg"
                                   placeholder="Confirm password" required />
                        </div>

                        <div class="text-center text-lg-start mt-4 pt-2">
                            <button type="submit" class="btn btn-success btn-lg w-100">Sign Up</button>
                            <p class="small fw-bold mt-2 pt-1 mb-0">Already have an account?  
                                <a href="{% url 'loginuser' %}" class="link-danger">Login</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="d-flex flex-column flex-md-row text-center text-md-start justify-content-between py-4 px-4 px-xl-5 bg-primary">
        <div class="text-white mb-3 mb-md-0">
            Copyright © 2025. All rights reserved.
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
